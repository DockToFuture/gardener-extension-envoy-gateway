---
images:
  - name: envoy-gateway
    resourceId:
      name: envoy-gateway
    sourceRepository: github.com/envoyproxy/gateway
    repository: europe-docker.pkg.dev/gardener-project/releases/3rd/envoyproxy/gateway
    tag: "v1.9.3"
  # gardener-extension-envoy-gateway is this extension's OWN image, used to run the
  # netpol-controller subcommand in the seed. The chart always overwrites this entry
  # via IMAGEVECTOR_OVERWRITE (see templates/configmap-imagevector-overwrite.yaml),
  # so no tag is needed here. Omitting the tag also prevents the release pipeline's
  # merge-ocm-fragments step from adding a stale-tag resource to the OCM component
  # descriptor (the correct resource is already contributed by the oci-ocm job).
  - name: gardener-extension-envoy-gateway
    sourceRepository: github.com/gardener/gardener-extension-envoy-gateway
    repository: europe-docker.pkg.dev/gardener-project/public/gardener/extensions/gardener-extension-envoy-gateway
