# Scenario 03 — one Gateway + ONE HTTPRoute referencing two Services, all in one namespace.
# Exercises : two backend targets reached via a single route (two backendRefs in one rule).
#   route attach = same-ns          backendRef = same-ns          backends/ns = 2 (both in s03)
# Ingredients: default-deny in s03; Gateway allowedRoutes from: Same.
# Expected   : BOTH httpbin-a and httpbin-b reachable.
# NOTE       : To this controller this is IDENTICAL to scenario 02 — listRouteInfos flattens all
#              backendRefs across routes/rules and dedups by (namespace, selector), so "2 routes/2
#              services" and "1 route/2 services" produce the same policy set. The difference is
#              only the Envoy routing shape (weighted load-balancing across both backends on /).
# ASSERTION  : connectivity cannot prove EACH backend opened — Envoy load-balances the two
#              backendRefs nondeterministically. Verify at the policy level, or probe statistically.
# KNOWN BUG  : same hop-3 same-namespace collision as scenario 02 (only the last backend opens).
---
apiVersion: v1
kind: Namespace
metadata:
  name: s03
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s03
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-a
  namespace: s03
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin-a }
  template:
    metadata:
      labels: { app: httpbin-a }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin-a
  namespace: s03
spec:
  selector: { app: httpbin-a }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-b
  namespace: s03
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin-b }
  template:
    metadata:
      labels: { app: httpbin-b }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin-b
  namespace: s03
spec:
  selector: { app: httpbin-b }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gw
  namespace: s03
spec:
  gatewayClassName: gardener-envoy-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: s03
spec:
  parentRefs:
    - name: demo-gw
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: httpbin-a
          port: 80
        - name: httpbin-b
          port: 80
