# Scenario 12 — NEGATIVE CONTROL: cross-namespace backendRef with NO ReferenceGrant.
# Exercises : that access is WITHHELD when a cross-namespace backendRef is not permitted.
#   route attach = same-ns (route + Gateway in s12)
#   backendRef   = CROSS-ns (route in s12 -> Service in s12-be) with NO ReferenceGrant
#   backends/ns  = 1
# Ingredients: default-deny in BOTH namespaces; Gateway allowedRoutes from: Same; deliberately NO
#              ReferenceGrant in s12-be.
# Expected   : NOT reachable. Envoy marks the backendRef unresolved (ResolvedRefs=False) and the
#              controller derives no backend-ingress policy, so default-deny keeps the backend shut.
#              (This is scenario 04 with the grant removed.)
---
apiVersion: v1
kind: Namespace
metadata:
  name: s12
---
apiVersion: v1
kind: Namespace
metadata:
  name: s12-be
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s12
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s12-be
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: s12-be
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin }
  template:
    metadata:
      labels: { app: httpbin }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: s12-be
spec:
  selector: { app: httpbin }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gw
  namespace: s12
spec:
  gatewayClassName: gardener-envoy-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: s12
spec:
  parentRefs:
    - name: demo-gw
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: httpbin
          namespace: s12-be
          port: 80
