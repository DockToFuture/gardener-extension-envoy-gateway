# Scenario 13 — NEGATIVE CONTROL: cross-namespace route attach rejected by allowedRoutes: Same.
# Exercises : that NO backend hole is opened for a route the Gateway refuses to attach.
#   route attach = CROSS-ns (route in s13-be -> Gateway in s13) but Gateway allows from: Same ONLY
#   backendRef   = same-ns (route + Service both in s13-be)
#   backends/ns  = 1
# Ingredients: default-deny in BOTH namespaces; Gateway allowedRoutes from: Same (NOT All);
#              HTTPRoute parentRef names namespace: s13.
# Expected   : NOT reachable. The Gateway rejects the cross-namespace route (NotAllowedByListeners),
#              so no route attaches and the controller must derive no backend policy. Guards against
#              the controller over-permissioning a route that Envoy does not actually serve.
#              (This is scenario 07 with the listener locked down to from: Same.)
---
apiVersion: v1
kind: Namespace
metadata:
  name: s13
---
apiVersion: v1
kind: Namespace
metadata:
  name: s13-be
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s13
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s13-be
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: s13-be
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin }
  template:
    metadata:
      labels: { app: httpbin }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: s13-be
spec:
  selector: { app: httpbin }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gw
  namespace: s13
spec:
  gatewayClassName: gardener-envoy-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: s13-be
spec:
  parentRefs:
    - name: demo-gw
      namespace: s13
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: httpbin
          port: 80
