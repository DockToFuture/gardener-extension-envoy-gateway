# Scenario 06 — Gateway + ONE HTTPRoute referencing two Services in another namespace.
# Exercises : backendRef cross-namespace axis with two backends via a single route.
#   route attach = same-ns (route + Gateway in s06)
#   backendRef   = CROSS-ns (route in s06 -> Services in s06-be) -> requires ReferenceGrant
#   backends/ns  = 2 (both in s06-be)
# Ingredients: default-deny in BOTH namespaces; Gateway allowedRoutes from: Same;
#              ReferenceGrant in s06-be permitting HTTPRoute(s06) -> Service.
# Expected   : BOTH httpbin-a and httpbin-b in s06-be reachable.
# NOTE       : policy-identical to scenario 05 (flattened + deduped backendRefs). Differs only in
#              routing shape (one route, weighted LB across both backends on /).
# ASSERTION  : as in scenario 03, a single probe cannot prove EACH backend opened (nondeterministic
#              LB). Verify at the policy level or probe statistically.
# KNOWN BUG  : hop-3 same-namespace collision (both backends in s06-be, one Gateway ns s06).
---
apiVersion: v1
kind: Namespace
metadata:
  name: s06
---
apiVersion: v1
kind: Namespace
metadata:
  name: s06-be
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s06
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s06-be
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-a
  namespace: s06-be
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin-a }
  template:
    metadata:
      labels: { app: httpbin-a }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin-a
  namespace: s06-be
spec:
  selector: { app: httpbin-a }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-b
  namespace: s06-be
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin-b }
  template:
    metadata:
      labels: { app: httpbin-b }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin-b
  namespace: s06-be
spec:
  selector: { app: httpbin-b }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gw
  namespace: s06
spec:
  gatewayClassName: gardener-envoy-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: s06
spec:
  parentRefs:
    - name: demo-gw
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: httpbin-a
          namespace: s06-be
          port: 80
        - name: httpbin-b
          namespace: s06-be
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-routes-from-s06
  namespace: s06-be
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: s06
  to:
    - group: ""
      kind: Service
