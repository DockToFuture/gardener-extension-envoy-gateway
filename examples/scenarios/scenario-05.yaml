# Scenario 05 — Gateway + two HTTPRoutes in one namespace, two Services in another.
# Exercises : backendRef cross-namespace axis with two backends.
#   route attach = same-ns (routes + Gateway in s05)
#   backendRef   = CROSS-ns (routes in s05 -> Services in s05-be) -> requires ReferenceGrant
#   backends/ns  = 2 (both in s05-be)
# Ingredients: default-deny in BOTH namespaces; Gateway allowedRoutes from: Same;
#              ReferenceGrant in s05-be permitting HTTPRoute(s05) -> Service; path split /a, /b.
# Expected   : BOTH httpbin-a and httpbin-b in s05-be reachable.
# KNOWN BUG  : hop-3 same-namespace collision — both backends live in s05-be and share one
#              Gateway namespace (s05), so their hop-3 policies collide (last-writer-wins).
---
apiVersion: v1
kind: Namespace
metadata:
  name: s05
---
apiVersion: v1
kind: Namespace
metadata:
  name: s05-be
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s05
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s05-be
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-a
  namespace: s05-be
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin-a }
  template:
    metadata:
      labels: { app: httpbin-a }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin-a
  namespace: s05-be
spec:
  selector: { app: httpbin-a }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-b
  namespace: s05-be
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin-b }
  template:
    metadata:
      labels: { app: httpbin-b }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin-b
  namespace: s05-be
spec:
  selector: { app: httpbin-b }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gw
  namespace: s05
spec:
  gatewayClassName: gardener-envoy-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-a
  namespace: s05
spec:
  parentRefs:
    - name: demo-gw
  rules:
    - matches:
        - path: { type: PathPrefix, value: /a }
      backendRefs:
        - name: httpbin-a
          namespace: s05-be
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-b
  namespace: s05
spec:
  parentRefs:
    - name: demo-gw
  rules:
    - matches:
        - path: { type: PathPrefix, value: /b }
      backendRefs:
        - name: httpbin-b
          namespace: s05-be
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-routes-from-s05
  namespace: s05-be
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: s05
  to:
    - group: ""
      kind: Service
