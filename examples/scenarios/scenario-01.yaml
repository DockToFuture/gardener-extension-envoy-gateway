# Scenario 01 — baseline: one Gateway + one HTTPRoute + one Service, all in one namespace.
# Exercises : hop-1/2/3 NetworkPolicy generation in the common case.
#   route attach = same-ns (route and Gateway share namespace s01)
#   backendRef   = same-ns (Service in the route's namespace)
#   backends/ns  = 1
# Ingredients: default-deny (Ingress+Egress) in s01; Gateway allowedRoutes from: Same.
# Expected   : httpbin reachable through the Gateway. Green on current controller.
---
apiVersion: v1
kind: Namespace
metadata:
  name: s01
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s01
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: s01
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin }
  template:
    metadata:
      labels: { app: httpbin }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: s01
spec:
  selector: { app: httpbin }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gw
  namespace: s01
spec:
  gatewayClassName: gardener-envoy-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: s01
spec:
  parentRefs:
    - name: demo-gw
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: httpbin
          port: 80
