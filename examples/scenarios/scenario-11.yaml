# Scenario 11 — one Gateway, two backends in TWO DIFFERENT namespaces.
# Exercises : two backend targets that live in separate namespaces (the positive counterpart to
#             "two backends in one namespace").
#   route attach = same-ns (routes + Gateway in s11)
#   backendRef   = CROSS-ns (routes in s11 -> Services in s11-be1 and s11-be2) -> ReferenceGrants
#   backends/ns  = 1 per backend namespace (two distinct backend namespaces)
# Ingredients: default-deny in all three namespaces; Gateway allowedRoutes from: Same;
#              a ReferenceGrant in each backend namespace; path split /a, /b.
# Expected   : httpbin in s11-be1 (via /a) AND httpbin in s11-be2 (via /b) both reachable; each
#              backend namespace gets its own backend-ingress policy.
---
apiVersion: v1
kind: Namespace
metadata:
  name: s11
---
apiVersion: v1
kind: Namespace
metadata:
  name: s11-be1
---
apiVersion: v1
kind: Namespace
metadata:
  name: s11-be2
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s11
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s11-be1
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s11-be2
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: s11-be1
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin }
  template:
    metadata:
      labels: { app: httpbin }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: s11-be1
spec:
  selector: { app: httpbin }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: s11-be2
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin }
  template:
    metadata:
      labels: { app: httpbin }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: s11-be2
spec:
  selector: { app: httpbin }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gw
  namespace: s11
spec:
  gatewayClassName: gardener-envoy-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-be1
  namespace: s11
spec:
  parentRefs:
    - name: demo-gw
  rules:
    - matches:
        - path: { type: PathPrefix, value: /a }
      backendRefs:
        - name: httpbin
          namespace: s11-be1
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-be2
  namespace: s11
spec:
  parentRefs:
    - name: demo-gw
  rules:
    - matches:
        - path: { type: PathPrefix, value: /b }
      backendRefs:
        - name: httpbin
          namespace: s11-be2
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-routes-from-s11
  namespace: s11-be1
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: s11
  to:
    - group: ""
      kind: Service
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-routes-from-s11
  namespace: s11-be2
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: s11
  to:
    - group: ""
      kind: Service
