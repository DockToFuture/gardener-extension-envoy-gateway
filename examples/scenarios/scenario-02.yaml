# Scenario 02 — one Gateway + two HTTPRoutes + two Services, all in one namespace.
# Exercises : two backend targets reached via two separate routes.
#   route attach = same-ns          backendRef = same-ns          backends/ns = 2 (both in s02)
# Ingredients: default-deny in s02; Gateway allowedRoutes from: Same; path split /a, /b.
# Expected   : BOTH httpbin-a and httpbin-b reachable.
# KNOWN BUG  : hop-3 (backend-ingress) policy name is keyed on the Gateway namespace only, so the
#              two same-namespace backends collide on one policy (last-writer-wins). Only the
#              backend applied last gets an ingress hole; the other stays blocked by default-deny.
---
apiVersion: v1
kind: Namespace
metadata:
  name: s02
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s02
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-a
  namespace: s02
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin-a }
  template:
    metadata:
      labels: { app: httpbin-a }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin-a
  namespace: s02
spec:
  selector: { app: httpbin-a }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-b
  namespace: s02
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin-b }
  template:
    metadata:
      labels: { app: httpbin-b }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin-b
  namespace: s02
spec:
  selector: { app: httpbin-b }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gw
  namespace: s02
spec:
  gatewayClassName: gardener-envoy-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-a
  namespace: s02
spec:
  parentRefs:
    - name: demo-gw
  rules:
    - matches:
        - path: { type: PathPrefix, value: /a }
      backendRefs:
        - name: httpbin-a
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-b
  namespace: s02
spec:
  parentRefs:
    - name: demo-gw
  rules:
    - matches:
        - path: { type: PathPrefix, value: /b }
      backendRefs:
        - name: httpbin-b
          port: 80
