# Scenario 09 — Gateway in one namespace; ONE HTTPRoute referencing two Services, all in another.
# Exercises : route-attachment cross-namespace axis with two backends via a single route.
#   route attach = CROSS-ns (route in s09-be -> Gateway in s09) -> requires allowedRoutes All
#   backendRef   = same-ns (route + Services all in s09-be) -> no ReferenceGrant needed
#   backends/ns  = 2 (both in s09-be)
# Ingredients: default-deny in BOTH namespaces; Gateway allowedRoutes from: All;
#              parentRef names namespace: s09.
# Expected   : BOTH httpbin-a and httpbin-b in s09-be reachable.
# NOTE       : policy-identical to scenario 08 (flattened + deduped backendRefs). Single-probe
#              connectivity cannot prove EACH backend opened (nondeterministic LB) — verify at the
#              policy level or probe statistically.
# KNOWN BUGS : needs BOTH controller fixes — cross-namespace route discovery AND hop-3 collision.
---
apiVersion: v1
kind: Namespace
metadata:
  name: s09
---
apiVersion: v1
kind: Namespace
metadata:
  name: s09-be
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s09
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s09-be
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-a
  namespace: s09-be
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin-a }
  template:
    metadata:
      labels: { app: httpbin-a }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin-a
  namespace: s09-be
spec:
  selector: { app: httpbin-a }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-b
  namespace: s09-be
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin-b }
  template:
    metadata:
      labels: { app: httpbin-b }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin-b
  namespace: s09-be
spec:
  selector: { app: httpbin-b }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gw
  namespace: s09
spec:
  gatewayClassName: gardener-envoy-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: s09-be
spec:
  parentRefs:
    - name: demo-gw
      namespace: s09
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: httpbin-a
          port: 80
        - name: httpbin-b
          port: 80
