# Scenario 10 — combo: one Gateway serving a same-namespace route AND a cross-namespace route.
# Exercises : BOTH cross-namespace axes at once, on a single Gateway and a single backend Service.
#   Gateway in s10 (allowedRoutes from: All), one Service httpbin in s10-be.
#   route-in-s10    : same-ns ATTACH  + CROSS-ns backendRef (s10 -> s10-be) -> needs ReferenceGrant
#   route-in-s10-be : CROSS-ns ATTACH + same-ns backendRef                   -> needs allowedRoutes All
# Ingredients: default-deny in BOTH namespaces; Gateway allowedRoutes from: All;
#              ReferenceGrant in s10-be for HTTPRoute(s10) -> Service; distinct paths per route.
# Expected   : httpbin in s10-be reachable via BOTH routes (both resolve to the same backend, so
#              one hop-3 policy — no collision here).
# KNOWN BUG  : the cross-namespace-ATTACH route (route-in-s10-be) is not discovered by the
#              controller (route-discovery gap), so the backend hole it needs is not opened.
#              The same-ns-attach route is discovered normally.
---
apiVersion: v1
kind: Namespace
metadata:
  name: s10
---
apiVersion: v1
kind: Namespace
metadata:
  name: s10-be
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s10
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: s10-be
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: s10-be
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin }
  template:
    metadata:
      labels: { app: httpbin }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: s10-be
spec:
  selector: { app: httpbin }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gw
  namespace: s10
spec:
  gatewayClassName: gardener-envoy-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
# Same-namespace attach, cross-namespace backendRef (-> s10-be, needs the ReferenceGrant below).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: via-gateway-ns
  namespace: s10
spec:
  parentRefs:
    - name: demo-gw
  rules:
    - matches:
        - path: { type: PathPrefix, value: /via-s10 }
      backendRefs:
        - name: httpbin
          namespace: s10-be
          port: 80
---
# Cross-namespace attach (parentRef names s10), same-namespace backendRef.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: via-backend-ns
  namespace: s10-be
spec:
  parentRefs:
    - name: demo-gw
      namespace: s10
  rules:
    - matches:
        - path: { type: PathPrefix, value: /via-s10-be }
      backendRefs:
        - name: httpbin
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-routes-from-s10
  namespace: s10-be
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: s10
  to:
    - group: ""
      kind: Service
