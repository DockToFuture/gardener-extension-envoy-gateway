---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.extension.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.extension.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
- apiGroups:
  - extensions.gardener.cloud
  resources:
  - clusters
  verbs:
  - get
  - list
  - watch
# Informers need cluster-wide read on extensions; mutating verbs are limited to
# this extension's own object (shoot-class extensions are named after their type).
- apiGroups:
  - extensions.gardener.cloud
  resources:
  - extensions
  - extensions/status
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - extensions.gardener.cloud
  resources:
  - extensions
  - extensions/status
  resourceNames:
  - envoy-gateway
  verbs:
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - list
  - watch

# Permissions required for deploying Envoy Gateway via ManagedResources.
# create cannot be name-scoped in RBAC; mutating verbs are limited to this
# extension's own ManagedResource.
- apiGroups:
  - resources.gardener.cloud
  resources:
  - managedresources
  verbs:
  - get
  - list
  - watch
  - create
- apiGroups:
  - resources.gardener.cloud
  resources:
  - managedresources
  resourceNames:
  - extension-envoy-gateway
  verbs:
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

# Permissions required for deploying the per-shoot data-plane NetworkPolicy
# controller into the shoot's control-plane namespace on the seed. create
# cannot be name-scoped; mutating verbs are limited to the controller's own
# Deployment.
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - envoy-gateway-netpol-controller
  verbs:
  - update
  - patch
  - delete
